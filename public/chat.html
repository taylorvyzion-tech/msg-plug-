<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <style>
    :root {
      --bg: #0B0B0B;
      --surface: #161616;
      --line: #272727;
      --accent: #C9A227;
      --text: #FFFFFF;
      --muted: #9A9A9A;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      line-height: 1.5;
    }
    .app {
      width: 100%;
      max-width: 560px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #000;
      display: grid; place-items: center; font-size: 1.2rem;
      flex-shrink: 0;
    }
    .who { min-width: 0; }
    .who strong { display: block; font-size: .98rem; }
    .who span { font-size: .76rem; color: var(--muted); }
    .dot { color: #3ddc84; }

    #log {
      flex: 1; overflow-y: auto;
      padding: 18px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 82%; padding: 10px 14px; border-radius: 16px;
      font-size: .92rem; white-space: pre-wrap; word-wrap: break-word;
      animation: pop .18s ease;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
    .bot  { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }
    .typing { display: flex; gap: 4px; align-items: center; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); display: block; animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; }
    .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 10px; }
    .chip {
      background: transparent; color: var(--accent);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 7px 13px; font: inherit; font-size: .8rem; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }

    form {
      display: flex; gap: 8px; padding: 12px 18px 18px;
      border-top: 1px solid var(--line); background: var(--surface);
    }
    input[type=text] {
      flex: 1; padding: 12px 14px; border-radius: 999px;
      background: #0F0F0F; border: 1px solid var(--line);
      color: var(--text); font: inherit; font-size: .92rem;
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    button[type=submit] {
      background: var(--accent); color: #000; border: 0;
      border-radius: 999px; padding: 0 20px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    footer { text-align: center; font-size: .7rem; color: #555; padding-bottom: 10px; }
    footer a { color: #666; text-decoration: none; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar">💬</div>
    <div class="who">
      <strong id="botName">Loading…</strong>
      <span><span class="dot">●</span> Usually replies instantly</span>
    </div>
  </header>

  <div id="log"></div>
  <div class="chips" id="chips"></div>

  <form id="form" autocomplete="off">
    <input type="text" id="msg" placeholder="Type your message…" maxlength="1000">
    <button type="submit">Send</button>
  </form>
  <footer>Powered by <a href="/" target="_blank">MSGPlug</a></footer>
</div>

<script>
  const slug = decodeURIComponent(location.pathname.split('/c/')[1] || '').replace(/\/+$/, '');
  const log = document.getElementById('log');
  const chipsEl = document.getElementById('chips');

  const sessionId = (() => {
    const k = 'msgplug_sid_' + slug;
    try {
      let v = sessionStorage.getItem(k);
      if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem(k, v); }
      return v;
    } catch {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
  })();

  function bubble(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function typing() {
    const d = document.createElement('div');
    d.className = 'msg bot typing';
    d.innerHTML = '<i></i><i></i><i></i>';
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function setChips(items) {
    chipsEl.innerHTML = '';
    (items || []).forEach(t => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = t;
      b.onclick = () => { chipsEl.innerHTML = ''; send(t); };
      chipsEl.appendChild(b);
    });
  }

  async function boot() {
    if (!slug) { bubble('No shop specified in the URL.', 'bot'); return; }
    try {
      const res = await fetch('/api/pack/' + encodeURIComponent(slug));
      if (!res.ok) throw new Error('not found');
      const data = await res.json();
      const b = data.branding || {};

      document.title = data.name || 'Chat';
      document.getElementById('botName').textContent = b.bot_name || data.name || 'Assistant';
      document.getElementById('avatar').textContent = b.avatar_emoji || '💬';

      const root = document.documentElement.style;
      if (b.background) root.setProperty('--bg', b.background);
      if (b.surface)    root.setProperty('--surface', b.surface);
      if (b.accent)     root.setProperty('--accent', b.accent);
      if (b.text)       root.setProperty('--text', b.text);

      bubble(b.greeting || 'Hey! How can I help?', 'bot');
      setChips(data.suggestions);
    } catch {
      bubble("Sorry — I couldn't find that shop. Double-check the link.", 'bot');
    }
  }

  async function send(text) {
    bubble(text, 'user');
    const t = typing();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, sessionId, message: text })
      });
      const data = await res.json();
      t.remove();
      bubble(data.reply || "Something went wrong on my end. Try again?", 'bot');
    } catch {
      t.remove();
      bubble("I lost connection for a second. Try that again?", 'bot');
    }
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('msg');
    const v = input.value.trim();
    if (!v) return;
    input.value = '';
    chipsEl.innerHTML = '';
    send(v);
  });

  boot();
</script>
</body>
</html>
